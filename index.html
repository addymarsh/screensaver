<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screensaver</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #lottie {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="stage" id="lottie" role="img" aria-label="Screensaver animation"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    (function () {
      const container = document.getElementById("lottie");
      const lottieApi = window.lottie || window.bodymovin;
      if (!lottieApi || !lottieApi.loadAnimation) {
        container.textContent = "Lottie could not load.";
        return;
      }
      const anim = lottieApi.loadAnimation({
        container,
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: "screensaver.json",
        rendererSettings: {
          preserveAspectRatio: "xMidYMid slice"
        }
      });
      function fit() {
        if (typeof anim.resize === "function") anim.resize();
      }
      window.addEventListener("resize", fit);
      anim.addEventListener("DOMLoaded", fit);
    })();
  </script>
</body>
</html>
